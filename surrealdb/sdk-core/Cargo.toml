[package]
name = "surrealdb-sdk-core"
publish = true
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["serde"] }
http.workspace = true
ipnet.workspace = true
jsonwebtoken = { workspace = true, default-features = false, features = ["use_pem"] }
revision.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
surrealdb-types.workspace = true
tokio = { workspace = true, default-features = false, features = ["net"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
web-time.workspace = true
humantime.workspace = true

[features]
default = []
http = []
surrealism = []
arbitrary = []

[lints]
workspace = true
